<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第五人格錄影解析控制面板</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary-gradient: linear-gradient(135deg, #f472b6 0%, #fb7185 100%);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #f472b6;
        }

        * {
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        body {
            font-family: 'Inter', "Microsoft JhengHei", sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(244, 114, 182, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(251, 113, 133, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 40px;
            background: var(--primary-gradient);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        /* 佈局網格 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subtle-note {
            margin-top: -8px;
            margin-bottom: 16px;
            color: var(--text-dim);
            font-size: 0.85rem;
            line-height: 1.5;
        }

        /* 狀態樣式 */
        .status-item {
            margin-bottom: 16px;
        }

        .status-label {
            font-size: 0.85rem;
            color: var(--text-dim);
            display: block;
            margin-bottom: 4px;
        }

        .status-value {
            font-weight: 500;
            word-break: break-all;
        }

        #monitor-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .summary-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        .summary-item {
            padding: 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .summary-label {
            display: block;
            color: var(--text-dim);
            font-size: 0.78rem;
            margin-bottom: 6px;
        }

        .summary-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .sync-toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .sync-toolbar .hint {
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        .secondary-button {
            width: auto;
            margin-top: 0;
            padding: 10px 14px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: none;
        }

        .secondary-button:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.12);
        }

        .sync-table-wrap {
            overflow-x: auto;
        }

        .sync-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 920px;
        }

        .sync-table th,
        .sync-table td {
            text-align: left;
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            vertical-align: top;
            font-size: 0.9rem;
        }

        .sync-table th {
            color: var(--text-dim);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .status-uploaded {
            background: rgba(16, 185, 129, 0.14);
            color: #86efac;
        }

        .status-failed,
        .status-parse_failed {
            background: rgba(239, 68, 68, 0.14);
            color: #fca5a5;
        }

        .status-pending,
        .status-uploading {
            background: rgba(59, 130, 246, 0.14);
            color: #93c5fd;
        }

        .status-waiting_for_config {
            background: rgba(245, 158, 11, 0.14);
            color: #fcd34d;
        }

        .record-error {
            color: #fda4af;
            font-size: 0.8rem;
            line-height: 1.5;
            word-break: break-word;
        }

        .action-cell button {
            width: auto;
            margin-top: 0;
            padding: 8px 12px;
            font-size: 13px;
        }

        /* 表單樣式 */
        .settings-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .settings-section {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"],
        select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(244, 114, 182, 0.2);
            background: rgba(15, 23, 42, 0.9);
        }

        button {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(244, 114, 182, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(244, 114, 182, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        /* 自定義滾動條 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .footer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-top: 40px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>第五錄影監控控制面板</h1>

        <div class="dashboard-grid">
            <div class="card status-card">
                <h2>系統狀態</h2>
                <div class="status-item">
                    <span class="status-label">監控服務狀態</span>
                    <span id="monitor-status" class="status-value">載入中...</span>
                </div>
                <div class="status-item">
                    <span class="status-label">監控目錄</span>
                    <span id="monitor-path" class="status-value">未設定</span>
                </div>
                <div class="status-item">
                    <span class="status-label">本地同步存放</span>
                    <span id="sync-store-path" class="status-value">載入中...</span>
                </div>
            </div>

            <div class="card">
                <h2>同步紀錄</h2>
                <div class="subtle-note">解析後的對局會先保存在本機，成功上傳與失敗項目都會列在這裡，可直接重傳失敗的對局。</div>
                <div class="summary-grid">
                    <div class="summary-item"><span class="summary-label">總數</span><span id="summary-total" class="summary-value">0</span></div>
                    <div class="summary-item"><span class="summary-label">已上傳</span><span id="summary-uploaded" class="summary-value">0</span></div>
                    <div class="summary-item"><span class="summary-label">失敗</span><span id="summary-failed" class="summary-value">0</span></div>
                    <div class="summary-item"><span class="summary-label">待處理</span><span id="summary-pending" class="summary-value">0</span></div>
                </div>
                <div class="sync-toolbar">
                    <span class="hint">最新紀錄會顯示在上方；失敗或等待設定的項目可手動重傳。</span>
                    <button class="secondary-button" type="button" onclick="retryAllFailed()">重傳全部失敗</button>
                </div>
                <div class="sync-table-wrap">
                    <table class="sync-table">
                        <thead>
                            <tr>
                                <th>建立時間</th>
                                <th>對局時間</th>
                                <th>來源</th>
                                <th>狀態</th>
                                <th>嘗試</th>
                                <th>最近錯誤</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="sync-records-body">
                            <tr><td colspan="7">正在獲取資料...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>設定與配置</h2>
            <div class="settings-section">
                <div class="form-group">
                    <label for="record-dir">錄像位置</label>
                    <input id="record-dir" type="text" value="{{ replay_path }}" placeholder="例如: C:\Games\IdentityV\Documents">
                </div>
                <div class="form-group">
                    <label for="backend-url">後端網址</label>
                    <input id="backend-url" type="text" value="" placeholder="https://idv-analyst-api.zalicsu.idv.tw 或 https://idv-analyst-api.zalicsu.idv.tw/api/v1/matches">
                    <small style="display:block;margin-top:6px;color:var(--text-dim);line-height:1.5;">
                        可填主機位址或完整上傳端點；系統會自動對齊到 <code>/api/v1/matches</code>。
                    </small>
                </div>
                <div class="form-group">
                    <label for="backend-key">API Key</label>
                    <input id="backend-key" type="password" value="" placeholder="輸入您的 api-key">
                </div>
                <div class="form-group">
                    <label for="user-select">監看目標</label>
                    <select id="user-select">
                        <option>載入中...</option>
                    </select>
                </div>
            </div>
            <button onclick="update()">更新並儲存設定</button>
        </div>
        <div class="footer">&copy; 2026 Zalicsu. 版權所有 第五錄影監控控制面板</div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // 載入玩家清單的函式
        function loadUserList(selectedUser = "") {
            $.get("/user_list", function (data) {
                let userSelect = $("#user-select");
                userSelect.empty();
                if (!data.users || data.users.length === 0) {
                    userSelect.append('<option value="">路徑下無玩家資料夾</option>');
                    return;
                }
                data.users.forEach(function (user) {
                    let option = $("<option></option>").attr("value", user).text(user);
                    if (user === selectedUser) option.attr("selected", true);
                    userSelect.append(option);
                });
            });
        }

        function formatTime(value) {
            if (!value) return "-";
            const parsed = new Date(value);
            if (Number.isNaN(parsed.getTime())) return String(value);
            return parsed.toLocaleString("zh-TW");
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        function statusText(status) {
            const labels = {
                uploaded: "已上傳",
                failed: "失敗",
                parse_failed: "解析失敗",
                pending: "待上傳",
                uploading: "上傳中",
                waiting_for_config: "等待設定",
            };
            return labels[status] || status || "未知";
        }

        function renderSyncRecords(records) {
            const tbody = $("#sync-records-body");
            tbody.empty();

            if (!records || records.length === 0) {
                tbody.append('<tr><td colspan="7">尚無同步紀錄</td></tr>');
                return;
            }

            records.forEach(function (record) {
                const statusClass = `status-${record.status || "pending"}`;
                const retryButton = record.retryable
                    ? `<button type="button" class="secondary-button" onclick="retryRecord('${record.id}')">重傳</button>`
                    : "-";
                const errorText = record.last_error ? `<div class="record-error">${escapeHtml(record.last_error)}</div>` : "-";
                const roomShort = record.room_guuid ? escapeHtml(String(record.room_guuid).slice(0, 8)) : "-";

                tbody.append(`
                    <tr>
                        <td>${formatTime(record.created_at)}</td>
                        <td>${formatTime(record.game_save_time)}</td>
                        <td>
                            <div>${escapeHtml(record.source_name || "-")}</div>
                            <div style="color: var(--text-dim); font-size: 0.8rem; margin-top: 4px;">${roomShort}</div>
                        </td>
                        <td><span class="status-pill ${statusClass}">${statusText(record.status)}</span></td>
                        <td>${record.attempts || 0}</td>
                        <td>${errorText}</td>
                        <td class="action-cell">${retryButton}</td>
                    </tr>
                `);
            });
        }

        function updateSummary(summary) {
            $("#summary-total").text(summary?.total ?? 0);
            $("#summary-uploaded").text(summary?.uploaded ?? 0);
            $("#summary-failed").text((summary?.failed ?? 0) + (summary?.parse_failed ?? 0));
            $("#summary-pending").text((summary?.pending ?? 0) + (summary?.uploading ?? 0) + (summary?.waiting_for_config ?? 0));
        }

        function loadSyncRecords() {
            $.get("/sync_records", function (data) {
                updateSummary(data.summary);
                renderSyncRecords(data.records);
                $("#sync-store-path").text(data.storage_dir || "未設定");
            });
        }

        $(document).ready(function () {
            // 初始載入
            loadUserList("{{ current_user }}");
            fetchStatus();
            setInterval(fetchStatus, 5000); // 每5秒更新一次狀態
            loadSyncRecords();
            setInterval(loadSyncRecords, 5000);
        });

        // 輪詢系統狀態
        function fetchStatus() {
            $.get("/health_check", function (data) {
                const statusHtml = data.is_monitoring 
                    ? '<span class="pulse-dot"></span> 監控中' 
                    : '<span class="pulse-dot" style="background-color: #ef4444; box-shadow: none; animation: none;"></span> 未監控';
                $("#monitor-status").html(statusHtml);
                $("#monitor-path").text(data.current_path || "無");
                if (data.sync_summary) {
                    updateSummary(data.sync_summary);
                }
            });
        }

        function retryRecord(recordId) {
            $.ajax({
                url: `/sync_records/${recordId}/retry`,
                type: "POST",
                success: function (data) {
                    alert(data.message);
                    loadSyncRecords();
                },
                error: function (xhr) {
                    let errorMsg = xhr.responseJSON ? xhr.responseJSON.detail : "未知錯誤";
                    alert("錯誤: " + errorMsg);
                }
            });
        }

        function retryAllFailed() {
            $.ajax({
                url: "/sync_records/retry_failed",
                type: "POST",
                success: function (data) {
                    alert(data.message);
                    loadSyncRecords();
                },
                error: function (xhr) {
                    let errorMsg = xhr.responseJSON ? xhr.responseJSON.detail : "未知錯誤";
                    alert("錯誤: " + errorMsg);
                }
            });
        }

        function update() {
            let payload = {
                user: $("#user-select").val(),
                record_path: $("#record-dir").val(),
                backend_url: $("#backend-url").val(),
                backend_key: $("#backend-key").val()
            };

            $.ajax({
                url: "/update_settings",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(payload),
                success: function (data) {
                    alert(data.message);
                    if (data.refresh_users) {
                        loadUserList(payload.user); // 重新整理清單
                    }
                    fetchStatus();
                    loadSyncRecords();
                },
                error: function (xhr) {
                    let errorMsg = xhr.responseJSON ? xhr.responseJSON.detail : "未知錯誤";
                    alert("錯誤: " + errorMsg);
                }
            });
        }
    </script>
</body>

</html>
